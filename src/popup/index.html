<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Vault</title>
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header class="vault-header">
    <div class="logo-area">
      <svg class="vault-icon" width="18" height="18" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="7" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.4"/>
        <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="title">Cookie Vault</span>
    </div>
    <div class="header-actions">
      <button id="logs-btn" class="icon-btn" title="Activity Logs">
        <svg width="14" height="14" viewBox="0 0 13 13" fill="none">
          <path d="M2 3.5h9M2 6.5h9M2 9.5h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <circle cx="8" cy="8" r="2.25"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- List of websites -->
  <main class="vault-body">
    <!-- Filter buttons -->
    <div class="filter-controls">
      <label class="filter-chip">
        <input type="checkbox" id="filter-vaulted" checked />
        <span>Vaulted</span>
      </label>
      <label class="filter-chip">
        <input type="checkbox" id="filter-unvaulted" checked />
        <span>Unvaulted</span>
      </label>
    </div>

    <!-- Manual search bar -->
    <div class="search-bar">
      <input type="text" id="site-search" placeholder="Search domain..." />
    </div>

    <div id="site-list" class="site-list">
      <!-- list of websites appear here. main.ts handles this -->
    </div>
  </main>
</div>

<script type="module" src="./main.ts"></script>
</body>
</html>
